<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#241126">

<title>عائشة & عزيز</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Kufi+Arabic:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#fff8f2;
  --ivory:#fffdf9;
  --rose:#d79baa;
  --rose2:#efcbd3;
  --lilac:#aa91bd;
  --purple:#4b2549;
  --deep:#241126;
  --plum:#34172f;
  --gold:#d8bd7a;
  --yellow:#f0df9f;
  --pearl:#fff7f1;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#17101a;
}

body{
  font-family:"Noto Kufi Arabic",sans-serif;
  color:var(--deep);
  overscroll-behavior:none;
  touch-action:pan-y;
}

/* =====================================================
   APP
===================================================== */

.app{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--cream);
}

.pages{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transition:transform .9s cubic-bezier(.77,0,.18,1);
  will-change:transform;
}

.page{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* =====================================================
   COMMON
===================================================== */

.page-number{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 18px);
  left:22px;
  z-index:30;
  font-family:"Cormorant Garamond",serif;
  font-size:13px;
  letter-spacing:3px;
  color:rgba(52,23,47,.5);
}

.page.dark .page-number{
  color:rgba(255,255,255,.45);
}

.gold-line{
  width:42px;
  height:1px;
  background:var(--gold);
}

.small-label{
  font-size:8px;
  letter-spacing:3px;
  color:#92717f;
}

.dark .small-label{
  color:#d2b7c8;
}

.arabic{
  font-family:"Amiri",serif;
}

/* =====================================================
   MERMAID MATERIAL
===================================================== */

.scale-field{
  position:absolute;
  inset:-8%;
  opacity:.8;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse 30px 23px at 50% 0,
      rgba(255,242,247,.82) 0 34%,
      rgba(220,185,126,.52) 35% 38%,
      rgba(133,91,143,.30) 39% 43%,
      transparent 44%
    );

  background-size:60px 46px;
  transform:rotate(-2deg) scale(1.12);
  filter:
    drop-shadow(0 4px 3px rgba(35,13,31,.20))
    saturate(1.1);
}

.scale-field:after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      115deg,
      transparent 20%,
      rgba(255,255,255,.4) 38%,
      transparent 53%
    ),
    linear-gradient(
      300deg,
      transparent 35%,
      rgba(211,157,205,.18) 55%,
      transparent 70%
    );

  animation:shine 8s linear infinite;
}

@keyframes shine{
  0%{transform:translateX(-20%)}
  50%{transform:translateX(20%)}
  100%{transform:translateX(-20%)}
}

/* =====================================================
   FLORAL LINE ART
===================================================== */

.botanical{
  position:absolute;
  pointer-events:none;
  opacity:.72;
}

.botanical svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.flower-stroke{
  fill:none;
  stroke:#c991a6;
  stroke-width:1.4;
}

.flower-fill{
  fill:url(#petalGradient);
  opacity:.82;
}

.flower-gold{
  fill:none;
  stroke:var(--gold);
  stroke-width:1;
}

/* =====================================================
   PAGE 0 — COVER
===================================================== */

.cover{
  background:
    radial-gradient(circle at 50% 35%,rgba(232,206,220,.32),transparent 25%),
    linear-gradient(145deg,#271126,#512541 48%,#251025);
  color:white;
}

.cover .scale-field{
  opacity:.52;
  transform:scale(1.4);
}

.cover-glow{
  position:absolute;
  width:75vw;
  height:75vw;
  border-radius:50%;
  left:50%;
  top:38%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(246,221,173,.15),transparent 66%);
  filter:blur(12px);
}

.cover-frame{
  position:absolute;
  inset:18px;
  border:1px solid rgba(222,193,128,.42);
}

.cover-frame:before,
.cover-frame:after{
  content:"";
  position:absolute;
  width:65px;
  height:65px;
  border-color:rgba(222,193,128,.65);
}

.cover-frame:before{
  top:-1px;
  right:-1px;
  border-top:1px solid;
  border-right:1px solid;
}

.cover-frame:after{
  bottom:-1px;
  left:-1px;
  border-bottom:1px solid;
  border-left:1px solid;
}

.cover-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:5;
}

.cover-kicker{
  font-size:8px;
  letter-spacing:4px;
  color:var(--yellow);
  margin-bottom:28px;
}

.cover-names{
  font-family:"Amiri",serif;
  font-size:78px;
  line-height:.8;
  font-weight:400;
}

.cover-names .and{
  font-family:"Cormorant Garamond",serif;
  color:var(--gold);
  font-size:35px;
  line-height:1.5;
}

.cover-date{
  margin-top:30px;
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  letter-spacing:4px;
  color:#e9d6df;
}

.cover-open{
  position:absolute;
  bottom:calc(env(safe-area-inset-bottom) + 38px);
  background:none;
  border:0;
  color:white;
  font-family:"Noto Kufi Arabic",sans-serif;
  font-size:9px;
  letter-spacing:2px;
}

.cover-open .arrow{
  display:block;
  margin:13px auto 0;
  width:34px;
  height:1px;
  background:var(--gold);
  position:relative;
}

.cover-open .arrow:after{
  content:"";
  position:absolute;
  left:0;
  top:-3px;
  width:7px;
  height:7px;
  border-left:1px solid var(--gold);
  border-bottom:1px solid var(--gold);
  transform:rotate(45deg);
}

/* =====================================================
   PAGE 1 — INTRO
===================================================== */

.intro-page{
  background:var(--ivory);
}

.intro-page .botanical{
  width:270px;
  height:400px;
  right:-85px;
  bottom:-50px;
}

.intro-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 42px;
}

.intro-overline{
  margin-bottom:24px;
}

.intro-title{
  font-family:"Amiri",serif;
  font-size:63px;
  line-height:1;
  font-weight:400;
  color:var(--plum);
}

.intro-title span{
  display:block;
}

.intro-title .small{
  font-size:28px;
  color:#a27a8e;
  margin:15px 0;
}

.intro-copy{
  margin-top:30px;
  font-family:"Amiri",serif;
  font-size:18px;
  line-height:2;
  color:#705364;
  max-width:320px;
}

.pearl-row{
  display:flex;
  gap:8px;
  margin-top:30px;
}

.pearl-row i{
  display:block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:linear-gradient(135deg,#fff,#d8b5ca);
  box-shadow:0 2px 7px rgba(81,38,67,.2);
}

/* =====================================================
   PAGE 2 — DATE
===================================================== */

.date-page{
  background:
    radial-gradient(circle at 15% 25%,rgba(214,159,178,.35),transparent 28%),
    radial-gradient(circle at 85% 75%,rgba(170,145,189,.30),transparent 30%),
    var(--cream);
}

.date-page .scale-panel{
  position:absolute;
  width:230px;
  height:430px;
  left:-90px;
  bottom:-100px;
  opacity:.25;
  transform:rotate(15deg);
}

.date-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 36px;
}

.date-arabic{
  font-family:"Amiri",serif;
  font-size:34px;
  color:var(--plum);
}

.date-rule{
  margin:22px 0;
}

.date-number{
  font-family:"Cormorant Garamond",serif;
  font-size:145px;
  font-weight:300;
  line-height:.7;
  color:var(--plum);
  direction:ltr;
  text-align:right;
}

.date-month{
  margin-top:25px;
  font-family:"Cormorant Garamond",serif;
  font-size:23px;
  letter-spacing:5px;
  color:#8b6578;
  direction:ltr;
  text-align:right;
}

.date-info{
  display:flex;
  margin-top:48px;
  gap:35px;
}

.date-info div{
  border-top:1px solid rgba(52,23,47,.2);
  padding-top:12px;
}

.date-info strong{
  display:block;
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  font-weight:400;
  color:var(--plum);
}

.date-info span{
  font-size:8px;
  letter-spacing:2px;
  color:#92717f;
}

/* =====================================================
   PAGE 3 — VENUE
===================================================== */

.venue-page{
  background:#2c1428;
  color:white;
}

.venue-page .scale-field{
  opacity:.19;
  transform:scale(1.5) rotate(8deg);
}

.venue-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 75% 30%,rgba(216,189,122,.16),transparent 25%),
    linear-gradient(to bottom,transparent 30%,rgba(20,8,20,.55));
}

.venue-content{
  position:absolute;
  inset:0;
  padding:0 34px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom) + 80px);
  z-index:5;
}

.venue-kicker{
  color:var(--yellow);
  font-size:8px;
  letter-spacing:4px;
  margin-bottom:20px;
}

.venue-title{
  font-family:"Amiri",serif;
  font-size:52px;
  line-height:1;
  font-weight:400;
}

.venue-english{
  direction:ltr;
  text-align:right;
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  color:#d7bfca;
  margin-top:12px;
}

.venue-place{
  margin-top:30px;
  border-top:1px solid rgba(216,189,122,.35);
  padding-top:18px;
}

.venue-place strong{
  display:block;
  font-family:"Amiri",serif;
  font-size:22px;
  font-weight:400;
}

.venue-place span{
  font-size:9px;
  color:#bca4b5;
}

.map-link{
  display:inline-flex;
  margin-top:22px;
  color:var(--yellow);
  border-bottom:1px solid rgba(216,189,122,.6);
  padding-bottom:6px;
  text-decoration:none;
  font-size:9px;
}

/* =====================================================
   PAGE 4 — DETAILS
===================================================== */

.details-page{
  background:var(--ivory);
}

.details-content{
  position:absolute;
  inset:0;
  padding:70px 34px 100px;
  display:flex;
  flex-direction:column;
}

.details-heading{
  font-family:"Amiri",serif;
  font-size:48px;
  line-height:1;
  color:var(--plum);
  margin-top:25px;
}

.details-heading small{
  display:block;
  font-family:"Cormorant Garamond",serif;
  direction:ltr;
  font-size:16px;
  letter-spacing:3px;
  color:#a0788c;
  margin-top:12px;
}

.event-list{
  margin-top:50px;
}

.event{
  position:relative;
  display:grid;
  grid-template-columns:75px 1fr;
  gap:18px;
  padding:0 0 32px;
}

.event:not(:last-child):after{
  content:"";
  position:absolute;
  right:34px;
  top:38px;
  width:1px;
  height:calc(100% - 25px);
  background:linear-gradient(var(--gold),rgba(216,189,122,.05));
}

.event-time{
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  color:var(--plum);
  direction:ltr;
  text-align:right;
}

.event-dot{
  position:absolute;
  right:30px;
  top:7px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 4px var(--ivory);
}

.event-body{
  padding-right:22px;
}

.event-body h3{
  font-family:"Amiri",serif;
  font-size:23px;
  font-weight:400;
  color:#4e2b43;
}

.event-body p{
  font-family:"Amiri",serif;
  font-size:14px;
  color:#846779;
  line-height:1.8;
  margin-top:4px;
}

/* =====================================================
   PAGE 5 — DRESS
===================================================== */

.dress-page{
  background:
    radial-gradient(circle at 25% 30%,rgba(215,155,170,.35),transparent 27%),
    radial-gradient(circle at 80% 70%,rgba(170,145,189,.32),transparent 28%),
    #fff7f0;
}

.dress-art{
  position:absolute;
  left:-50px;
  top:80px;
  width:260px;
  height:260px;
  border-radius:50%;
  background:
    radial-gradient(ellipse 30px 23px at 50% 0,
    rgba(255,255,255,.7) 0 34%,
    rgba(216,189,122,.4) 35% 38%,
    rgba(170,145,189,.28) 39% 43%,
    transparent 44%);
  background-size:60px 46px;
  transform:rotate(25deg);
  opacity:.7;
}

.dress-content{
  position:absolute;
  inset:0;
  padding:0 34px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.dress-label{
  font-size:8px;
  letter-spacing:4px;
  color:#997285;
}

.dress-title{
  font-family:"Amiri",serif;
  font-size:61px;
  color:var(--plum);
  line-height:1;
  margin-top:22px;
}

.dress-text{
  font-family:"Amiri",serif;
  font-size:19px;
  line-height:2;
  color:#715264;
  margin-top:28px;
  max-width:310px;
}

.palette{
  display:flex;
  gap:12px;
  margin-top:35px;
}

.palette i{
  width:34px;
  height:34px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.7);
  box-shadow:0 0 0 1px rgba(53,23,47,.12);
}

.palette i:nth-child(1){background:#d79baa}
.palette i:nth-child(2){background:#b09bc2}
.palette i:nth-child(3){background:#efdc9c}
.palette i:nth-child(4){background:#fff2e9}
.palette i:nth-child(5){background:#512842}

/* =====================================================
   PAGE 6 — COUNTDOWN
===================================================== */

.count-page{
  background:
    radial-gradient(circle at 50% 35%,rgba(218,181,202,.25),transparent 30%),
    #291228;
  color:white;
}

.count-page .scale-field{
  opacity:.14;
  transform:scale(1.55);
}

.count-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 30px;
  text-align:center;
}

.count-label{
  color:var(--yellow);
  font-size:8px;
  letter-spacing:4px;
}

.count-title{
  font-family:"Amiri",serif;
  font-size:55px;
  font-weight:400;
  margin-top:20px;
}

.count-sub{
  font-family:"Cormorant Garamond",serif;
  font-size:15px;
  letter-spacing:3px;
  color:#c9aebe;
  direction:ltr;
  margin-top:8px;
}

.count-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin-top:55px;
  border-top:1px solid rgba(216,189,122,.3);
  border-bottom:1px solid rgba(216,189,122,.3);
}

.count-box{
  padding:20px 4px;
  border-left:1px solid rgba(216,189,122,.15);
}

.count-box:last-child{
  border-left:0;
}

.count-num{
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  color:var(--yellow);
}

.count-unit{
  display:block;
  margin-top:5px;
  color:#bba5b5;
  font-size:6px;
  letter-spacing:1px;
}

/* =====================================================
   PAGE 7 — RSVP
===================================================== */

.rsvp-page{
  background:var(--ivory);
}

.rsvp-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:35px;
}

.rsvp-monogram{
  width:100px;
  height:100px;
  border:1px solid var(--gold);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Amiri",serif;
  font-size:29px;
  color:var(--plum);
  position:relative;
}

.rsvp-monogram:before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(216,189,122,.4);
  border-radius:50%;
}

.rsvp-title{
  font-family:"Amiri",serif;
  font-size:58px;
  line-height:1;
  color:var(--plum);
  margin-top:35px;
}

.rsvp-text{
  font-family:"Amiri",serif;
  color:#765666;
  font-size:17px;
  line-height:2;
  margin-top:22px;
  max-width:300px;
}

.rsvp-note{
  margin-top:35px;
  font-size:8px;
  letter-spacing:2px;
  color:#9b7888;
}

/* =====================================================
   PAGE 8 — END
===================================================== */

.end-page{
  background:
    radial-gradient(circle at 50% 30%,rgba(237,200,216,.22),transparent 30%),
    linear-gradient(145deg,#271126,#512541,#251025);
  color:white;
}

.end-page .scale-field{
  opacity:.34;
}

.end-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.end-small{
  font-size:8px;
  letter-spacing:4px;
  color:var(--yellow);
}

.end-names{
  font-family:"Amiri",serif;
  font-size:78px;
  line-height:.8;
  margin-top:30px;
}

.end-and{
  font-family:"Cormorant Garamond",serif;
  font-size:33px;
  color:var(--gold);
  margin:15px;
}

.end-date{
  margin-top:35px;
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  letter-spacing:4px;
  color:#ddc9d3;
  direction:ltr;
}

/* =====================================================
   NAVIGATION
===================================================== */

.nav{
  position:fixed;
  z-index:100;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 12px;
  border:1px solid rgba(53,23,47,.14);
  background:rgba(255,250,246,.75);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border-radius:30px;
}

.nav.dark{
  background:rgba(40,18,38,.72);
  border-color:rgba(216,189,122,.2);
}

.nav-dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#bba3af;
  transition:.35s;
}

.nav-dot.active{
  width:18px;
  border-radius:10px;
  background:var(--gold);
}

.nav-arrow{
  border:0;
  background:none;
  width:25px;
  height:20px;
  color:#664255;
  font-size:13px;
}

.nav.dark .nav-arrow{
  color:#ead8df;
}

/* =====================================================
   SWIPE HINT
===================================================== */

.swipe-hint{
  position:fixed;
  z-index:80;
  right:18px;
  bottom:calc(env(safe-area-inset-bottom) + 23px);
  font-size:7px;
  letter-spacing:1px;
  color:#846777;
  pointer-events:none;
  opacity:.8;
}

/* =====================================================
   MOBILE SAFETY
===================================================== */

@media(min-width:700px){

  .app{
    width:430px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:
      0 0 0 1px #111,
      0 30px 100px rgba(0,0,0,.45);
  }

  body{
    background:#151116;
  }

}

/* =====================================================
   OPENING ANIMATION
===================================================== */

#coverIntro{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#241126;
  overflow:hidden;
  transition:opacity 1s ease,visibility 1s ease;
}

#coverIntro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.cover-door{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  overflow:hidden;
  background:
    linear-gradient(135deg,#6d3d61,#35172f 55%,#241126);
  transition:transform 1.6s cubic-bezier(.77,0,.18,1);
}

.cover-door.left{
  right:50%;
  border-left:1px solid rgba(216,189,122,.25);
}

.cover-door.right{
  left:50%;
  border-right:1px solid rgba(216,189,122,.25);
}

.cover-door .scale-field{
  opacity:.72;
}
