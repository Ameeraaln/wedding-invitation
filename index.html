<style>

/* =========================
   BASE
   ========================= */

.flower-entrance {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 680px;
  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #fffdf7 0%,
      #f8f0e4 48%,
      #eee2d1 100%
    );

  isolation: isolate;
}


/* subtle paper grain */

.flower-entrance::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  z-index: 30;

  background-image:
    repeating-radial-gradient(
      circle at 20% 30%,
      rgba(100,70,40,.12) 0 1px,
      transparent 1px 5px
    );

  mix-blend-mode: multiply;
}


/* =========================
   BACKGROUND FLOWERS
   ========================= */

.floral-bg {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.flower {
  position: absolute;

  font-family: Georgia, serif;

  color: #f0dfca;

  text-shadow:
    0 8px 20px rgba(85,58,35,.15);

  opacity: .9;
}

.flower-a {
  font-size: 120px;
  left: -25px;
  top: 10%;
  transform: rotate(-20deg);
}

.flower-b {
  font-size: 85px;
  right: -12px;
  top: 16%;
  transform: rotate(25deg);
}

.flower-c {
  font-size: 150px;
  left: -40px;
  bottom: 10%;
}

.flower-d {
  font-size: 105px;
  right: -20px;
  bottom: 14%;
}

.flower-e {
  font-size: 55px;
  left: 20%;
  top: 5%;
}

.flower-f {
  font-size: 65px;
  right: 17%;
  bottom: 4%;
}


/* botanical accents */

.leaf {
  position: absolute;

  color: #bda887;

  font-size: 95px;

  opacity: .55;

  filter: drop-shadow(
    0 5px 7px rgba(60,40,20,.12)
  );
}

.leaf-a {
  left: 2%;
  top: 30%;
  transform: rotate(-35deg);
}

.leaf-b {
  right: 2%;
  top: 36%;
  transform: rotate(30deg);
}

.leaf-c {
  left: 7%;
  bottom: 30%;
  transform: rotate(20deg);
}

.leaf-d {
  right: 8%;
  bottom: 27%;
  transform: rotate(-20deg);
}


/* =========================
   PETAL FIELDS
   ========================= */

.petal-field {
  position: absolute;
  top: -8%;
  width: 62%;
  height: 116%;

  z-index: 10;

  transition:
    transform 2.2s cubic-bezier(.16,.84,.22,1);
}


/* LEFT */

.left-field {
  left: -15%;
}


/* RIGHT */

.right-field {
  right: -15%;
}


/* =========================
   REAL PETAL SHAPE
   ========================= */

.petal {
  position: absolute;

  width: 270px;
  height: 420px;

  border-radius:
    72% 28% 65% 35%
    / 58% 48% 52% 42%;

  background:
    radial-gradient(
      ellipse at 42% 25%,
      #fffefa 0%,
      #f8eee1 35%,
      #e8d7c1 78%,
      #d5c0a6 100%
    );

  box-shadow:
    inset -15px -25px 40px rgba(120,85,50,.12),
    inset 12px 12px 28px rgba(255,255,255,.9),
    0 20px 35px rgba(80,55,30,.18);

  transform-origin: 50% 100%;

  transition:
    transform 2.1s cubic-bezier(.18,.84,.22,1),
    filter 2s ease;
}


/* PETAL RIDGES */

.petal::before,
.petal::after {
  content: "";

  position: absolute;
  inset: 7% 18% 8% 20%;

  border-radius: inherit;

  pointer-events: none;
}

.petal::before {
  background:
    repeating-linear-gradient(
      105deg,
      transparent 0 14px,
      rgba(150,115,80,.13) 15px 17px,
      transparent 18px 31px
    );

  opacity: .55;
}

.petal::after {
  background:
    radial-gradient(
      ellipse at center,
      transparent 50%,
      rgba(110,75,45,.12) 100%
    );
}


/* =========================
   LEFT PETAL POSITIONS
   ========================= */

.petal-l1 {
  left: 8%;
  top: 5%;
  transform: rotate(-36deg);
}

.petal-l2 {
  left: 28%;
  top: 0;
  transform: rotate(-18deg) scale(.92);
}

.petal-l3 {
  left: 8%;

  transform: rotate(-58deg) scale(1.08);
}

.petal-l4 {
  left: 34%;
  top: 25%;
  transform: rotate(-28deg) scale(.9);
}

.petal-l5 {
  left: -5%;
  top: 48%;
  transform: rotate(-72deg) scale(.95);
}

.petal-l6 {
  left: 27%;
  top: 49%;
  transform: rotate(-43deg);
}

.petal-l7 {
  left: 4%;
  top: 70%;
  transform: rotate(-60deg) scale(.85);
}

.petal-l8 {
  left: 34%;
  top: 69%;
  transform: rotate(-30deg) scale(.78);
}


/* =========================
   RIGHT PETALS
   ========================= */

.petal-r1 {
  right: 8%;
  top: 5%;
  transform: rotate(36deg);
}

.petal-r2 {
  right: 28%;
  top: 0;
  transform: rotate(18deg) scale(.92);
}

.petal-r3 {
  right: 8%;
  top: 28%;
  transform: rotate(58deg) scale(1.08);
}

.petal-r4 {
  right: 34%;
  top: 25%;
  transform: rotate(28deg) scale(.9);
}

.petal-r5 {
  right: -5%;
  top: 48%;
  transform: rotate(72deg) scale(.95);
}

.petal-r6 {
  right: 27%;
  top: 49%;
  transform: rotate(43deg);
}

.petal-r7 {
  right: 4%;
  top: 70%;
  transform: rotate(60deg) scale(.85);
}

.petal-r8 {
  right: 34%;
  top: 69%;
  transform: rotate(30deg) scale(.78);
}


/* =========================
   OPENING
   ========================= */

.flower-entrance.opened .left-field {
  transform: translateX(-78%) rotate(-8deg);
}

.flower-entrance.opened .right-field {
  transform: translateX(78%) rotate(8deg);
}


/* individual petal movement */

.flower-entrance.opened .petal-l1 {
  transform: translate(-180px,-100px) rotate(-60deg);
}

.flower-entrance.opened .petal-l2 {
  transform: translate(-230px,-20px) rotate(-42deg);
}

.flower-entrance.opened .petal-l3 {
  transform: translate(-260px,50px) rotate(-75deg);
}

.flower-entrance.opened .petal-l4 {
  transform: translate(-210px,100px) rotate(-48deg);
}

.flower-entrance.opened .petal-l5 {
  transform: translate(-280px,180px) rotate(-95deg);
}

.flower-entrance.opened .petal-l6 {
  transform: translate(-220px,240px) rotate(-70deg);
}


.flower-entrance.opened .petal-r1 {
  transform: translate(180px,-100px) rotate(60deg);
}

.flower-entrance.opened .petal-r2 {
  transform: translate(230px,-20px) rotate(42deg);
}

.flower-entrance.opened .petal-r3 {
  transform: translate(260px,50px) rotate(75deg);

.flower-entrance.opened .petal-r4 {

}

.flower-entrance.opened .petal-r5 {

}

.flower-entrance.opened .petal-r6 {
  transform: translate(220px,240px) rotate(70deg);
}


/* =========================
   BOW
   ========================= */

.falling-bow {
  position: absolute;

  top: -180px;
  left: 50%;

  width: 170px;
  height: 260px;

  transform:
    translateX(-50%)
    scale(.82);

  z-index: 25;

  animation:
    bowFall 4s cubic-bezier(.22,.8,.25,1)
    forwards;

  pointer-events: none;
}


/* loops */

.bow-loop {
  position: absolute;

  top: 20px;

  width: 85px;
  height: 95px;

  background:
    linear-gradient(
      145deg,
      #fff9ef,
      #ead8bf 55%,
      #cdb28f
    );

  box-shadow:
    inset 10px 5px 15px rgba(255,255,255,.8),
    inset -10px -12px 20px rgba(100,70,40,.18),
    0 10px 25px rgba(70,45,20,.18);

  border-radius:
    75% 25% 60% 40%;
}

.bow-left {
  left: 3px;
  transform: rotate(-22deg);
}

.bow-right {
  right: 3px;
  transform: scaleX(-1) rotate(-22deg);
}


/* knot */

.bow-knot {
  position: absolute;

  left: 50%;
  top: 65px;

  width: 42px;
  height: 50px;

  transform: translateX(-50%);

  border-radius: 48%;

  background:
    radial-gradient(
      circle at 35% 25%,
      #fffdf7,
      #e4ceb0 75%
    );

  box-shadow:
    0 8px 15px rgba(80,50,25,.18);
}


/* tails */

.bow-tail {
  position: absolute;

  top: 95px;

  width: 45px;
  height: 150px;

  background:
    linear-gradient(
      90deg,
      #cfb18b,
      #f8ead7,
      #d5bb99
    );

  clip-path:
    polygon(
      10% 0,
      90% 0,
      100% 100%,
      50% 82%,
      0 100%
    );

  box-shadow:
    0 12px 20px rgba(70,45,20,.15);
}

.bow-tail-left {
  left: 32px;
  transform: rotate(9deg);
}

.bow-tail-right {
  right: 32px;
  transform: rotate(-9deg);
}


/* falling animation */

@keyframes bowFall {

  0% {
    top: -220px;
    opacity: 0;
    transform:
      translateX(-50%)
      rotate(-4deg)
      scale(.72);
  }

  45% {
    opacity: 1;
  }

  78% {
    top: 5%;
    transform:
      translateX(-50%)
      rotate(2deg)
      scale(.84);
  }

  88% {
    top: 3%;
    transform:
      translateX(-50%)
      rotate(-1deg)
      scale(.84);
  }

  100% {
    top: 4%;
    transform:
      translateX(-50%)
      rotate(0deg)
      scale(.84);
  }
}


/* =========================

/* invitation line */

.invite-line {

}


/* date */

.date {

  line-height: 1.8;

}

.date strong {

/* ornaments */

.ornament {

/* button */

.open-button {

}

.open-button:hover {

  box-shadow:

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

  .flower-entrance {
    min-height: 700px;
  }

    width: 75%;
  }

  .petal {

  }

  .left-field {

/* =========================
   REDUCED MOTION FALLBACK
   ========================= */

@media (prefers-reduced-motion: reduce) {

  .falling-bow {
    animation: none;
    top: 4%;
  }

  .petal-field,
  .petal {
    transition: none;
  }

}


/* =========================
   TAP INTERACTION
   ========================= */

.flower-entrance.opened .open-button {
  opacity: 0;
  pointer-events: none;
}

</style>


<script>

const entrance =
  document.getElementById("entrance");

const openButton =
  document.getElementById("openFlower");


openButton.addEventListener("click", () => {

  entrance.classList.add("opened");

  /*
   * Give the flower time to open,
   * then allow normal page scrolling.
   */

  setTimeout(() => {

    document.body.classList.remove(
      "entrance-locked"
    );

  }, 1800);

});

</script>
