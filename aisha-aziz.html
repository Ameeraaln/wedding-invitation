#opening {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  justify-content: center;

    linear-gradient(135deg, #fff4f7, #f9e9ff);
  transition: opacity 1s ease, visibility 1s ease;
}

#opening.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.opening-content {
  width: 100%;

.flower {

.f3 { bottom: 17%; left: 12%; animation-delay: 2s; }
.f4 { bottom: 10%; right: 8%; animation-delay: 3s; }

@keyframes float {

  50% { transform: translateY(-18px) rotate(12deg); }
}

.invited {

}

/* ENVELOPE */

.envelope {
  width: min(330px, 88vw);
  height: 215px;
  position: relative;
  margin: auto;
  cursor: pointer;
  filter: drop-shadow(0 18px 25px rgba(143, 67, 110, .2));
}

/* lace */

.lace {
  position: absolute;
  inset: -12px;
  z-index: 20;
  pointer-events: none;
  border: 5px dotted #e7a7c1;
  border-radius: 20px;
  box-shadow:
    0 0 0 5px rgba(255,255,255,.7),
    0 0 0 9px #d88bb0;
}

.lace::before,
.lace::after {
  content: "✿  ❀  ✿  ❀  ✿  ❀  ✿";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: #d47fa9;
  font-size: 17px;
  white-space: nowrap;
}

.lace::before {
  top: -15px;
}

.lace::after {
  bottom: -15px;
}

/* envelope body */

.envelope-body {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ffb8d0, #e986b1);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #c96891;
}

/* side folds */

.left-fold,
.right-fold {
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  z-index: 4;
}

.left-fold {
  left: 0;
  border-top: 108px solid transparent;
  border-bottom: 108px solid transparent;
  border-left: 165px solid #f29abd;
}

.right-fold {
  right: 0;
  border-top: 108px solid transparent;
  border-bottom: 108px solid transparent;
  border-right: 165px solid #f29abd;
}

/* paper */

.paper {
  position: absolute;
  z-index: 2;
  width: 82%;
  height: 88%;
  left: 9%;
  top: 6%;
  background: #fffdfd;
  border-radius: 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
  box-shadow: 0 8px 20px rgba(90,40,70,.15);
}

.paper-inner {
  text-align: center;
}

.paper-aa {
  font-family: "Great Vibes", cursive;
  font-size: 45px;
  color: var(--hot-pink);
}

.paper-inner small {
  display: block;
  font-size: 7px;
  letter-spacing: 3px;
  color: var(--purple);
}

/* flap */

.flap {
  position: absolute;
  z-index: 6;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 165px solid transparent;
  border-right: 165px solid transparent;
  border-top: 112px solid #f7a9c5;
  transform-origin: top center;
  transition: transform 1s ease;
}

/* bottom fold */

.bottom-fold {
  position: absolute;
  z-index: 5;
  bottom: 0;
  left: 0;
  border-left: 165px solid transparent;
  border-right: 165px solid transparent;
  border-bottom: 112px solid #ea8fb6;
}

/* ribbon */

.ribbon-v {
  position: absolute;
  z-index: 8;
  width: 20px;
  height: 100%;
  background: rgba(255,255,255,.42);
  left: calc(50% - 10px);
}

.ribbon-h {
  position: absolute;
  z-index: 8;
  height: 20px;
  width: 100%;
  background: rgba(255,255,255,.42);
  top: calc(50% - 10px);
}

/* seal */

.seal {
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle, #f2c76e, #b77c31);
  color: white;

  justify-content: center;
  align-items: center;
  font-family: "Great Vibes", cursive;
  font-size: 27px;
  border: 3px solid #ffe4a8;
  box-shadow: 0 5px 15px rgba(120,70,30,.3);
  transition: opacity .4s;
}

.envelope.open .flap {
  transform: rotateX(180deg);
}

.envelope.open .paper {
  transform: translateY(-125px);
}

.envelope.open .seal {
  opacity: 0;
}
